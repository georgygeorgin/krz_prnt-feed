name: F9 Baltic XML feed

on:
  schedule:
    - cron: '10 */4 * * *'   # every 4 hours (UTC), 30 min apart from Prenta
  workflow_dispatch:
    inputs:
      probe:
        description: 'Only print the API answer structure (no publish)'
        type: boolean
        default: false
      spec_parts:
        description: 'Product card probe: comma-separated part numbers (no publish). Leave empty for normal run'
        type: string
        default: ''
      force:
        description: 'Publish even if the new feed is much smaller than the last one (use once after a deliberate filter change)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# serialize this workflow's own runs only - a shared group with Prenta's workflow
# was starving its scheduled cron (GitHub skips a workflow's queued scheduled run
# while another workflow holds a shared concurrency group). Each feed now restores
# and republishes both cached files regardless of order, so cross-serializing the
# two workflows is no longer needed for correctness.
concurrency:
  group: pages-feed-f9
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
    env:
      F9_USER: ${{ secrets.F9_USER }}
      F9_PASS: ${{ secrets.F9_PASS }}
      F9_CLIENT_ID: ${{ secrets.F9_CLIENT_ID }}
      F9_KEY: ${{ secrets.F9_KEY }}
      F9_ONLY_EAN: ${{ vars.F9_ONLY_EAN }}
      F9_SKIP_CATS: ${{ vars.F9_SKIP_CATS }}
      F9_FORCE: ${{ inputs.force && '1' || '' }}
      F9_CARDS_CACHE: f9_cards.json
    steps:
      - uses: actions/checkout@v4

      - name: Product card probe (photos, specs)
        if: ${{ inputs.spec_parts != '' }}
        env:
          SPEC_PARTS: ${{ inputs.spec_parts }}
        run: python3 f9/f9_feed.py --specprobe "$SPEC_PARTS" LAT,ENG

      - name: Probe API answer
        if: ${{ inputs.probe && inputs.spec_parts == '' }}
        run: python3 f9/f9_feed.py --probe

      # product cards (photos, specs) cache: new cards are fetched in batches, old ones are reused
      - uses: actions/cache/restore@v4
        if: ${{ !inputs.probe && inputs.spec_parts == '' }}
        with:
          path: f9_cards.json
          key: f9-cards-${{ github.run_id }}
          restore-keys: f9-cards-

      # Every feed keeps its latest file in the Actions cache (private, not on Pages), and every deploy
      # puts ALL feeds back together, so one feed never wipes another.
      - uses: actions/cache/restore@v4
        if: ${{ !inputs.probe && inputs.spec_parts == '' }}
        with:
          path: feeds-f9
          key: feed-f9-none
          restore-keys: feed-f9-
      - uses: actions/cache/restore@v4
        if: ${{ !inputs.probe && inputs.spec_parts == '' }}
        with:
          path: feeds-prenta
          key: feed-prenta-none
          restore-keys: feed-prenta-

      - name: Collect feeds into public/
        if: ${{ !inputs.probe && inputs.spec_parts == '' }}
        run: |
          mkdir -p public feeds-f9 feeds-prenta
          cp -n feeds-f9/* public/ 2>/dev/null || true
          cp -n feeds-prenta/* public/ 2>/dev/null || true
          # first run after the switch (empty cache): take what is online now
          if [ -n "${{ vars.F9_FEED_FILE }}" ] && [ ! -s "public/${{ vars.F9_FEED_FILE }}" ]; then
            curl -fsS "${{ vars.PAGES_URL }}/${{ vars.F9_FEED_FILE }}" -o "public/${{ vars.F9_FEED_FILE }}" || true
          fi
          if [ -n "${{ vars.FEED_FILE }}" ] && [ ! -s "public/${{ vars.FEED_FILE }}" ]; then
            curl -fsS "${{ vars.PAGES_URL }}/${{ vars.FEED_FILE }}" -o "public/${{ vars.FEED_FILE }}" || true
          fi
          ls -la public

      - name: Build XML from F9 API
        if: ${{ !inputs.probe && inputs.spec_parts == '' }}
        run: python3 f9/f9_feed.py "public/${{ vars.F9_FEED_FILE }}"

      - uses: actions/cache/save@v4
        if: ${{ always() && !inputs.probe && inputs.spec_parts == '' }}
        with:
          path: f9_cards.json
          key: f9-cards-${{ github.run_id }}

      - name: Keep the new feed in the cache
        if: ${{ !inputs.probe && inputs.spec_parts == '' }}
        run: |
          rm -f feeds-f9/*
          cp "public/${{ vars.F9_FEED_FILE }}" feeds-f9/
      - uses: actions/cache/save@v4
        if: ${{ !inputs.probe && inputs.spec_parts == '' }}
        with:
          path: feeds-f9
          key: feed-f9-${{ github.run_id }}

      - name: No directory listing
        if: ${{ !inputs.probe && inputs.spec_parts == '' }}
        run: echo '<!doctype html><title>.</title>' > public/index.html

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.probe && inputs.spec_parts == '' }}
        with:
          path: public

      # deploy-pages occasionally fails right after a successful upload with
      # "Found 0 artifact(s)" - a GitHub-side indexing race, not anything in
      # this workflow. One retry after a short wait clears it.
      - id: deploy1
        if: ${{ !inputs.probe && inputs.spec_parts == '' }}
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying the Pages deploy
        if: ${{ !inputs.probe && inputs.spec_parts == '' && steps.deploy1.outcome == 'failure' }}
        run: sleep 20

      - id: deploy2
        if: ${{ !inputs.probe && inputs.spec_parts == '' && steps.deploy1.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
