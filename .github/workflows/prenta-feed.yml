name: Prenta XML feed

on:
  schedule:
    - cron: '40 */4 * * *'   # every 4 hours (UTC)
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

# serialize this workflow's own runs only - see f9-feed.yml for why this is no
# longer shared with F9's workflow.
concurrency:
  group: pages-feed-prenta
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      # product cards (EAN) cache: only new/changed cards are re-fetched
      - uses: actions/cache/restore@v4
        with:
          path: prenta_cache.json
          key: prenta-cache-${{ github.run_id }}
          restore-keys: prenta-cache-

      # Every feed keeps its latest file in the Actions cache (private, not on Pages), and every deploy
      # puts ALL feeds back together, so one feed never wipes another.
      - uses: actions/cache/restore@v4
        with:
          path: feeds-prenta
          key: feed-prenta-none
          restore-keys: feed-prenta-
      - uses: actions/cache/restore@v4
        with:
          path: feeds-f9
          key: feed-f9-none
          restore-keys: feed-f9-

      - name: Collect feeds into public/
        run: |
          mkdir -p public feeds-prenta feeds-f9
          cp -n feeds-prenta/* public/ 2>/dev/null || true
          cp -n feeds-f9/* public/ 2>/dev/null || true
          # first run after the switch (empty cache): take what is online now
          if [ -n "${{ vars.FEED_FILE }}" ] && [ ! -s "public/${{ vars.FEED_FILE }}" ]; then
            curl -fsS "${{ vars.PAGES_URL }}/${{ vars.FEED_FILE }}" -o "public/${{ vars.FEED_FILE }}" || true
          fi
          if [ -n "${{ vars.F9_FEED_FILE }}" ] && [ ! -s "public/${{ vars.F9_FEED_FILE }}" ]; then
            curl -fsS "${{ vars.PAGES_URL }}/${{ vars.F9_FEED_FILE }}" -o "public/${{ vars.F9_FEED_FILE }}" || true
          fi
          ls -la public

      - name: Build XML from Prenta API
        env:
          PRENTA_USER: ${{ secrets.PRENTA_USER }}
          PRENTA_PASS: ${{ secrets.PRENTA_PASS }}
          PRENTA_CACHE: prenta_cache.json
        run: python3 prenta_feed.py "public/${{ vars.FEED_FILE }}"

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: prenta_cache.json
          key: prenta-cache-${{ github.run_id }}

      - name: Keep the new feed in the cache
        run: |
          rm -f feeds-prenta/*
          cp "public/${{ vars.FEED_FILE }}" feeds-prenta/
      - uses: actions/cache/save@v4
        with:
          path: feeds-prenta
          key: feed-prenta-${{ github.run_id }}

      - name: No directory listing
        run: echo '<!doctype html><title>.</title>' > public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # deploy-pages occasionally fails right after a successful upload with
      # "Found 0 artifact(s)" - a GitHub-side indexing race, not anything in
      # this workflow. One retry after a short wait clears it.
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying the Pages deploy
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20

      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
